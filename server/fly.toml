app = 'commitcat-api'
primary_region = 'nrt'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "commitcat_data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite:/data/commitcat.db?mode=rwc"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

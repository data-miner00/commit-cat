app = "commitcat-api"
primary_region = "nrt"  # Tokyo (한국에서 가장 가까운 리전)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "commitcat_data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite:/data/commitcat.db?mode=rwc"
